<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | GOAT SHIRTS</title>

    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header class="navbar">
    <div class="container">

        <a href="index.html" class="logo">
            GOAT SHIRTS
        </a>

        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="categories.html">Categories</a>
            <a href="cart.html">Cart</a>
        </nav>

    </div>
</header>

<section class="featured">

    <div class="container">

        <div class="product-grid">

<div>

    <div class="product-gallery">

        <img
            id="mainImage"
            src="images/sample-shirt-front.png"
            alt="GOAT Shirt">

        <div class="thumbnail-row">

            <img
                class="thumb active"
                src="images/sample-shirt-front.png"
                onclick="changeImage(this)"
                alt="Front">

            <img
                class="thumb"
                src="images/sample-shirt-back.png"
                onclick="changeImage(this)"
                alt="Back">

        </div>

    </div>

</div>

            <div>

                <h1>Sample Shirt</h1>

                <h2 style="margin:20px 0;">$24.99</h2>

                <p>
                    This premium GOAT SHIRTS design is printed on a soft,
                    comfortable t-shirt that's perfect for everyday wear.
                </p>

                <br>

                <label><strong>Select Size</strong></label>

                <br><br>

                <select style="padding:12px;width:220px;font-size:16px;">

                    <option>Small</option>
                    <option>Medium</option>
                    <option>Large</option>
                    <option>XL</option>
                    <option>2XL</option>

                </select>

                <br><br>

                <button class="shop-btn">

                    Add to Cart

                </button>

                <br><br>

                <a href="categories.html">

                    ← Back to Categories

                </a>

            </div>

        </div>

    </div>

</section>

<footer class="site-footer">

    <div class="container">

        <p>© 2026 GOAT SHIRTS</p>

        <p>Stand Out. Wear GOAT.</p>

    </div>

</footer>
<script>
function changeImage(img) {

    document.getElementById("mainImage").src = img.src;

    document.querySelectorAll(".thumb").forEach(function(t) {
        t.classList.remove("active");
    });

    img.classList.add("active");

}
</script>

<script src="script.js"></script>

</body>
</html>
